# 构建 Quest 3S 应用 FrankaTeleop.apk：跑离线测试后导出，APK 作为 Artifact 上传；推 v* 标签时发布到 Release。
#
# 签名（可选，配了才能在不同构建之间覆盖安装）：仓库 Settings → Secrets and variables → Actions 里加
#   FRANKA_KEYSTORE_BASE64  base64 -i keystore/franka-teleop.keystore（macOS）/ base64 -w0（Linux）的输出
#   FRANKA_KEYSTORE_USER    别名，本地 build_apk.sh 生成的是 frankateleop
#   FRANKA_KEYSTORE_PASS    密码，即 keystore/franka-teleop.pass 的内容
# 没配时构建调试版，调试签名每次都不同，覆盖安装前要先卸载旧版。
name: Build Quest APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 推标签时创建 Release

env:
  GODOT_VERSION: 4.6.2
  # 与 Godot 4.6.2 的 Android 构建模板（vr-app/android/build/config.gradle）一致
  ANDROID_BUILD_TOOLS: 35.0.1
  ANDROID_PLATFORM: android-35
  ANDROID_NDK: 28.1.13356709

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python 依赖（适配器测试、dry-run 冒烟测试）
        run: pip install numpy pyyaml

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" --install "platform-tools" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;$ANDROID_PLATFORM" \
            "ndk;$ANDROID_NDK" >/dev/null

      - name: 缓存 Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: 下载 Godot 和 Android 导出模板
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # 导出模板 1.2 GB，只解出 Android 用的部分
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/android*' 'templates/version.txt' -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP/tpl/templates" ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"

      - name: 编辑器设置（SDK 路径、调试签名）
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -keystore ~/debug.keystore -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          ~/godot/godot --version

      - name: OpenXR Vendors 插件
        run: bash tools/fetch_addons.sh

      - name: 离线测试（适配器、头显状态机与解算、冒烟）
        run: GODOT=$HOME/godot/godot PYTHON=python bash tools/run_vr_tests.sh

      - name: 构建 APK
        env:
          FRANKA_KEYSTORE_BASE64: ${{ secrets.FRANKA_KEYSTORE_BASE64 }}
          FRANKA_KEYSTORE_USER: ${{ secrets.FRANKA_KEYSTORE_USER }}
          FRANKA_KEYSTORE_PASS: ${{ secrets.FRANKA_KEYSTORE_PASS }}
        run: |
          export GODOT=$HOME/godot/godot
          if [ -n "$FRANKA_KEYSTORE_BASE64" ] && [ -n "$FRANKA_KEYSTORE_PASS" ]; then
            echo "$FRANKA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/franka-teleop.keystore"
            export FRANKA_KEYSTORE=$RUNNER_TEMP/franka-teleop.keystore
            bash tools/build_apk.sh release
          else
            echo "::warning::没有配置签名 secrets，构建调试版：每次签名不同，覆盖安装前要先卸载旧版"
            bash tools/build_apk.sh debug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FrankaTeleop
          path: build/FrankaTeleop.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/FrankaTeleop.apk
